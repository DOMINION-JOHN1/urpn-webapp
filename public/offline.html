<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0C0F" />
    <title>Offline · URPN</title>
    <script>
      try {
        if (localStorage.getItem('urpn-theme') === 'light') {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F2F4');
        }
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0d0c0f;
        --surface: #161419;
        --line: #2b2631;
        --text: #f6f3f0;
        --muted: #a79fa9;
        --dim: #807884;
        --accent: #6a1557;
        --gold: #d8b56f;
        color-scheme: dark;
      }
      html.light {
        --canvas: #f6f2f4;
        --surface: #ffffff;
        --line: #e4dbe1;
        --text: #1b131a;
        --muted: #5a4c56;
        --dim: #877a85;
        --accent: #5a104b;
        --gold: #8a6423;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--canvas);
        color: var(--text);
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }
      .badge {
        margin-top: 24px;
        display: flex;
        width: 48px;
        height: 48px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
      }
      .label {
        margin: 20px 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gold);
      }
      h1 {
        margin: 10px 0 0;
        font-size: 30px;
        line-height: 1.12;
        letter-spacing: -0.035em;
        font-weight: 600;
      }
      p {
        margin: 12px auto 0;
        max-width: 360px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      a {
        margin-top: 24px;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      .foot {
        margin-top: 40px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <img class="mark" src="/brand/urpn-mark.png" alt="URPN emblem" />
    <div class="badge" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 2l20 20" />
        <path d="M8.5 16.5a5 5 0 0 1 7.4-6.7" />
        <path d="M5 12.5a10 10 0 0 1 5.2-8.1" />
        <path d="M15.5 4.1a10 10 0 0 1 3.6 2.9" />
        <path d="M19.2 15.2a10 10 0 0 1-2.4 3.3" />
        <path d="M12 20h.01" />
      </svg>
    </div>
    <p class="label">You are offline</p>
    <h1>The portal needs a connection.</h1>
    <p>
      Your saved session and progress are safe. Reconnect to load your lessons, stream teaching,
      or continue an exam.
    </p>
    <a href="/portal">Try again</a>
    <p class="foot">Restore · Equip · Deploy</p>
  </body>
</html>
