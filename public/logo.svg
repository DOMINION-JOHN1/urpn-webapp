<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Golden Menorah / Flame Emblem -->
  <g transform="translate(10, 8)">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="30%" stop-color="#F59E0B" />
        <stop offset="70%" stop-color="#D97706" />
        <stop offset="100%" stop-color="#B45309" />
      </linearGradient>
      <linearGradient id="flameGlow" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#EF4444" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#FEF08A" />
      </linearGradient>
      <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    
    <!-- Central Stem -->
    <path d="M42 22 V68 M36 68 H48 M32 74 H52 M28 80 H56" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Left Branches -->
    <path d="M42 58 C26 58 20 44 20 30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M42 48 C30 48 28 40 28 30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M42 38 C36 38 34 34 34 30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Right Branches -->
    <path d="M42 58 C58 58 64 44 64 30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M42 48 C54 48 56 40 56 30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M42 38 C48 38 50 34 50 30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- 7 Flames -->
    <!-- Branch 1 (Far Left) -->
    <path d="M20 28 C18 24 19 20 20 16 C21 20 22 24 20 28 Z" fill="url(#flameGlow)" filter="url(#subtleGlow)" />
    <!-- Branch 2 -->
    <path d="M28 28 C26 24 27 20 28 16 C29 20 30 24 28 28 Z" fill="url(#flameGlow)" filter="url(#subtleGlow)" />
    <!-- Branch 3 -->
    <path d="M34 28 C32 24 33 20 34 16 C35 20 36 24 34 28 Z" fill="url(#flameGlow)" filter="url(#subtleGlow)" />
    <!-- Center Flame (Taller) -->
    <path d="M42 20 C39 15 41 10 42 6 C43 10 45 15 42 20 Z" fill="url(#flameGlow)" filter="url(#subtleGlow)" />
    <!-- Branch 5 -->
    <path d="M50 28 C48 24 49 20 50 16 C51 20 52 24 50 28 Z" fill="url(#flameGlow)" filter="url(#subtleGlow)" />
    <!-- Branch 6 -->
    <path d="M56 28 C54 24 55 20 56 16 C57 20 58 24 56 28 Z" fill="url(#flameGlow)" filter="url(#subtleGlow)" />
    <!-- Branch 7 (Far Right) -->
    <path d="M64 28 C62 24 63 20 64 16 C65 20 66 24 64 28 Z" fill="url(#flameGlow)" filter="url(#subtleGlow)" />
  </g>

  <!-- Typography: URPN -->
  <text x="96" y="52" font-family="'Cinzel', Georgia, serif" font-size="38" font-weight="800" letter-spacing="4" fill="url(#goldGrad)">
    URPN
  </text>

  <!-- Tagline: Restoring People, Family, Spheres, and Territories -->
  <text x="98" y="70" font-family="'Outfit', 'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#D97706" opacity="0.95">
    RESTORING PEOPLE, FAMILY, SPHERES &amp; TERRITORIES
  </text>
</svg>
